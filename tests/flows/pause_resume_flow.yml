id: pause-resume-flow
description: Pause and resume fixture in YAML format
striders:
  main:
    steps:
      sum_step:
        activity: ../activities/add_values.php

      pause_once:
        condition: ../activities/should_pause_once.php
        context:
          pause_once_done: true
        pause: true

      uppercase_step:
        activity: ../activities/uppercase_text.php

      set_flow_result:
        context:
          flow_result: resume_done
