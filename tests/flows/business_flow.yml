id: business-flow
description: Business flow fixture in YAML format
root_folder: ../activities
blocks:
  main:
    steps:
      sum_step:
        activity: add_values

      prepare_line:
        activity: build_file_line

      jump_if_audit_enabled:
        condition: is_audit_enabled
        jump: audit.audit_stamp

      go_finalize:
        jump: finalize.set_read_key

  audit:
    steps:
      audit_stamp:
        activity: stamp_now_iso

      add_audit_line:
        activity: append_audit_to_file_line

      go_finalize:
        jump: finalize.set_read_key

  finalize:
    steps:
      set_read_key:
        context:
          read_key: sum

      read_sum:
        activity: read_context_value

      normalize_text:
        activity: uppercase_text

      write_result:
        activity: write_file_line

      set_flow_result:
        context:
          flow_result: business_done
