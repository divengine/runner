name: Tests

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  php:
    name: php ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ "8.1", "8.2", "8.3", "8.4", "8.5" ]

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock --no-interaction

      - name: PHP syntax check
        run: find src tests examples -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --no-progress

      - name: Run tests
        run: vendor/bin/phpunit --colors=never

      - name: Installation smoke test
        run: bash scripts/smoke_install.sh

  # Stable check name required by the branch protection of main.
  phpunit:
    name: phpunit
    needs: php
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All PHP versions passed
        run: test "${{ needs.php.result }}" = "success"
